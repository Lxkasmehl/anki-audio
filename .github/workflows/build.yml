name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Unit tests and APK
        run: gradle testDebugUnitTest assembleDebug --stacktrace
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
      - name: Publish rolling release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk anki-audio.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest anki-audio.apk \
            --prerelease --title "Neuester Build" \
            --notes "Build #${GITHUB_RUN_NUMBER} von ${GITHUB_SHA::7}" \
            --target "$GITHUB_SHA"
